name: Android release

# Tag a release to publish an installable APK:
#
#   git tag android-v1.0.0 && git push origin android-v1.0.0
#
# Or run this workflow by hand from the Actions tab to get a signed build
# without cutting a release.

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            name="${GITHUB_REF_NAME#android-v}"
          elif [ -n "${{ inputs.version }}" ]; then
            name="${{ inputs.version }}"
          else
            name="0.0.${{ github.run_number }}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Building version $name (code ${{ github.run_number }})"

      - name: Check signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. An unsigned APK cannot be installed."
            echo "::error::See android/README.md for how to create a keystore and add the four repository secrets."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Written outside the workspace so it can never be committed or uploaded.
      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK and App Bundle
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Name the outputs after the version
        run: |
          version="${{ steps.version.outputs.name }}"
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk "artifacts/masjidhub-$version.apk"
          cp app/build/outputs/bundle/release/app-release.aab "artifacts/masjidhub-$version.aab"
          ls -lh artifacts

      - name: Confirm the APK is signed
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$build_tools/apksigner" verify --print-certs \
            "artifacts/masjidhub-${{ steps.version.outputs.name }}.apk"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: masjidhub-release-${{ steps.version.outputs.name }}
          path: android/artifacts/*
          if-no-files-found: error

      # Only tags produce a public release page; manual runs stop at artifacts.
      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "MasjidHub Android ${{ steps.version.outputs.name }}" \
            --notes "Install the APK on an Android 8.0 or newer phone or tablet. You may need to allow installing from your browser or file manager the first time." \
            "artifacts/masjidhub-${{ steps.version.outputs.name }}.apk" \
            "artifacts/masjidhub-${{ steps.version.outputs.name }}.aab"
