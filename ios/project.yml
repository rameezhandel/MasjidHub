name: MasjidHub
options:
  bundleIdPrefix: app.masjidhub
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  MasjidHub:
    type: application
    platform: iOS
    settings:
      base:
        # Universal: iPhone (1) and iPad (2).
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: app.masjidhub.staff
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Pick your Apple team in Xcode's Signing & Capabilities pane.
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: MasjidHub
        # Both orientations on iPad; portrait-first on iPhone.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Which API the app talks to. Point at a local API for development.
        INFOPLIST_KEY_APIBaseURL: https://masjidhub-api.onrender.com
    sources:
      - path: MasjidHub
